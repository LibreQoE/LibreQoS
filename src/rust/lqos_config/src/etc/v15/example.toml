version = "1.5"
lqos_directory = "/opt/libreqos/src"
state_directory = "/opt/libreqos/state"
node_id = "0000-0000-0000"
node_name = "Example Node"
packet_capture_time = 10
display_cobrand = false
enable_circuit_heatmaps = true
enable_site_heatmaps = true
enable_asn_heatmaps = true

[tuning]
set_cpu_governor_performance = true
stop_irq_balance = true
netdev_budget_usecs = 8000
netdev_budget_packets = 300
rx_usecs = 8
tx_usecs = 8
disable_rxvlan = true
disable_txvlan = true
disable_offload = [ "gso", "tso", "lro", "sg", "gro" ]

# EITHER:
[bridge]
to_internet = "eth0"
to_network = "eth1"
# mtu = 1500

# OR:
#[single_interface]
#interface = "eth0"
#internet_vlan = 2
#network_vlan = 3
# mtu = 1500

#[ssl]
#enabled = false
#external_hostname = "libreqos.example.com"
#managed_by_libreqos = false

[queues]
default_sqm = "cake diffserv4"
queue_mode = "shape"
# Legacy compatibility field preserved for older binaries during upgrades.
monitor_only = false
uplink_bandwidth_mbps = 1000
downlink_bandwidth_mbps = 1000
generated_pn_download_mbps = 1000
generated_pn_upload_mbps = 1000
dry_run = false
sudo = false
#override_available_queues = 12 # This can be omitted and be 0 for Python
# DPDK scheduler WORKER count ("--workers"). Omit to DERIVE it from the link
# bandwidth + physical cores (docs/zero_manual_ports_installer_card.md B.4).
# NOTE: this is NOT override_available_queues above -- that one tunes the
# CAKE/placement QUEUE BUILD (lqos_python/lqos_topology), a different axis.
#workers = 4
use_binpacking = false

[power]
# Host CPU power posture (docs/power_profile_work_order.md). Turbo is ALWAYS off
# (forced) — there is no turbo knob and no way to enable it through LibreQoS.
# balanced (default) = turbo off, change nothing else (does not fight
# tuned/cpupower/power-profiles-daemon/BIOS).
# eco = + a ~65% frequency cap + "power" EPP.
# performance = + governor/EPP performance + shallow C-states (still no turbo).
# Applied by libreqos-setup / libreqos-power.service (bare metal only).
profile = "balanced"
# eco's frequency cap, as a percent of the turbo-off maximum (default 65; 10-100).
#eco_max_freq_pct = 65

[long_term_stats]
gather_stats = true
collation_period_seconds = 10
license_key = "(data)"

[local_api]
bearer_token = ""

[ip_ranges]
ignore_subnets = [ "192.168.0.0/16" ]
allow_subnets = [ "172.16.0.0/12", "10.0.0.0/8", "100.64.0.0/16", "192.168.0.0/16" ]

[integration_common]
circuit_name_as_address = false
queue_refresh_interval_mins = 30
use_mikrotik_ipv6 = false
ethernet_port_limits_enabled = true
# Optional override. If omitted, LibreQoS uses a conservative default of 0.94.
# ethernet_port_limit_multiplier = 0.94

[mikrotik_ipv6]
config_path = "/etc/libreqos/mikrotik_ipv6.toml"

[integration_common.topology_attachment_health]
enabled = true
probe_interval_seconds = 1
fail_after_missed = 5
hold_down_seconds = 30
clear_after_successes = 3
refresh_debounce_seconds = 3

[splynx_integration]
enable_splynx = false
api_key = ""
api_secret = ""
url = ""

[netzur_integration]
enable_netzur = false
api_key = ""
api_url = ""
timeout_secs = 60

[visp_integration]
enable_visp = false
client_id = ""
client_secret = ""
username = ""
password = ""
# Leave blank to auto-select the first ISP ID returned by the token endpoint.
#isp_id = 0
timeout_secs = 20
# Optional RADIUS domain for online session enrichment.
#online_users_domain = ""

[topology]
source = "shaped_devices"
compile_mode = "ap_site"

[uisp_integration]
enable_uisp = false
token = ""
url = ""
site = ""
strategy = ""
suspended_strategy = ""
airmax_capacity = 1.0
airmax_flexible_frame_download_ratio = 0.8
ltu_capacity = 1.0
exclude_sites = []
ipv6_with_mikrotik = false
bandwidth_overhead_factor = 1.0
commit_bandwidth_multiplier = 0.98
exception_cpes = []
infrastructure_transport_caps_enabled = true

[powercode_integration]
enable_powercode = false
powercode_api_key = ""
powercode_api_url = ""

[sonar_integration]
enable_sonar = false
sonar_api_key = ""
sonar_api_url = ""
snmp_community = "public"
airmax_model_ids = [ "" ]
ltu_model_ids = [ "" ]
active_status_ids = [ "" ]
recurring_excluded_service_names = []
recurring_service_rates = []

[wispgate_integration]
enable_wispgate = false
wispgate_api_token = ""
wispgate_api_url = ""

[influxdb]
enable_influxdb = false
url = "http://localhost:8086"
org = "libreqos"
bucket = "Your ISP Name Here"
token = ""
