<div class="row">
    <div class="col-12">
        <h5 data-i18n="unknown_ips.title"><i class="fa fa-question"></i> Unrecognized IP Addresses</h5>
        <p data-i18n="unknown_ips.intro">These are the IP addresses that have been seen on the network, but have not been assigned to a device.</p>
        <div class="mb-2">
            <button class="btn btn-primary" type="button" id="btnCsv" data-i18n="unknown_ips.download_csv">
                <i class="fa fa-table"></i> Download as CSV
            </button>
            <button class="btn btn-outline-danger ms-2" type="button" id="btnClear" data-i18n="unknown_ips.clear">
                <i class="fa fa-trash"></i> Clear Unknowns
            </button>
        </div>
        <div id="unknown" data-i18n="common.state.loading_wait">
            <i class="fa fa-spinner fa-spin"></i> Loading, Please Wait...
        </div>
    </div>
</div>

<script src="unknown-ips.js%CACHEBUSTERS%"></script>
