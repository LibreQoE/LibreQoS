[package]
name = "api_test"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1"
bytes = "1.10.1"
clap = { version = "4.5.32", features = ["derive", "env"] }
serde_json = "1.0"
sha2 = "0.10.8"
urlencoding = "2.1.3"

# Reuse API types and config path resolution
lqos_api = { path = ".." }
lqos_config = { path = "../../lqos_config" }

[workspace]
# Standalone: this smoke-test CLI keeps its own lockfile (the v3 workspace
# excludes it).
