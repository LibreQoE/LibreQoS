[package]
name = "lqos_api"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4" }
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1.41"
utoipa = "5.4.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
sysinfo = "0.32.1"
once_cell = "1"
trippy-core = "0.13.0"
sha2 = "0"
toml = "0.8.8"
uuid = "1.17.0"


lqos_config = { path = "../lqos_config" }
lqos_bus = { path = "../lqos_bus" }
lqos_utils = { path = "../lqos_utils" }

surge-ping = "0.8.2"
rand = "0.9"

# Overrides management
lqos_overrides = { path = "../lqos_overrides" }
base16ct = { version = "0.3.0", features = ["alloc"] }

[features]
default = []

[dev-dependencies]
http-body-util = "0.1.3"
serial_test = "3.2.0"
tempfile = "3.12.0"
tokio = { version = "1.46.1", features = ["test-util"] }
tower = "0.5.2"
