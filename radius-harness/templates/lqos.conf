version = "1.5"
lqos_directory = "/opt/libreqos/src"
state_directory = "/opt/libreqos/state"
node_id = "radius-lab"
node_name = "RADIUS PPPoE Lab"
packet_capture_time = 10
queue_check_period_ms = 1000
display_cobrand = false
enable_circuit_heatmaps = true
enable_site_heatmaps = true
enable_asn_heatmaps = true

[tuning]
set_cpu_governor_performance = false
stop_irq_balance = false
netdev_budget_usecs = 8000
netdev_budget_packets = 300
rx_usecs = 8
tx_usecs = 8
disable_rxvlan = true
disable_txvlan = true
disable_offload = ["gso", "tso", "lro", "sg", "gro"]

[bridge]
use_xdp_bridge = false
to_internet = "lqos-wan"
to_network = "lqos-lan"

[queues]
default_sqm = "cake diffserv4"
queue_mode = "shape"
monitor_only = false
uplink_bandwidth_mbps = 100
downlink_bandwidth_mbps = 100
generated_pn_download_mbps = 100
generated_pn_upload_mbps = 100
dry_run = true
sudo = false
use_binpacking = false

[long_term_stats]
gather_stats = false
collation_period_seconds = 10
license_key = ""

[local_api]
bearer_token = ""

[ip_ranges]
ignore_subnets = []
allow_subnets = ["172.16.0.0/12", "10.0.0.0/8", "100.64.0.0/16", "192.168.0.0/16"]

[integration_common]
circuit_name_as_address = false
queue_refresh_interval_mins = 30
use_mikrotik_ipv6 = false
ethernet_port_limits_enabled = true

[netzur_integration]
enable_netzur = false
api_key = ""
api_url = ""
timeout_secs = 60

[visp_integration]
enable_visp = false
client_id = ""
client_secret = ""
username = ""
password = ""
timeout_secs = 20

[influxdb]
enable_influxdb = false
url = "http://localhost:8086"
org = "libreqos"
bucket = "RADIUS Lab"
token = ""

[dynamic_circuits]
enabled = true

[radius_accounting]
enabled = true
listen = "198.18.10.10:1813"
default_ttl_seconds = 12
stale_grace_seconds = 2

[radius_accounting.dynamic_circuit_application]
enabled = true
match_shaped_devices_by_mac = true
match_shaped_devices_by_username = true
fallback_parent_node = "PPPoE Access"
fallback_parent_node_id = "lab-pppoe-access"
fallback_anchor_node_id = "lab-core"

[radius_accounting.fallback_speed_profile]
download_min_mbps = 4.0
upload_min_mbps = 2.0
download_max_mbps = 30.0
upload_max_mbps = 12.0

[[radius_accounting.clients]]
name = "radius-routeros"
source = ["198.18.10.1/32"]
secret_file = "/etc/libreqos/radius-shared-secret"
