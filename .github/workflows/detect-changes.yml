name: detect-changes

# Shared change detection for lint_python.yml and rust.yml. Callers gate their
# heavy jobs on the `matched` output; see .github/scripts/changed-files.sh.
on:
  workflow_call:
    inputs:
      group:
        description: File group to detect (python or rust)
        required: true
        type: string
    outputs:
      matched:
        description: "true when files in the group changed"
        value: ${{ jobs.detect.outputs.matched }}

jobs:
  detect:
    runs-on: lq_run
    outputs:
      matched: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect ${{ inputs.group }} changes
        id: filter
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/changed-files.sh "${{ inputs.group }}"
